name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test (Testcontainers uses the runner's Docker)
        run: ./mvnw -B verify
      - name: Build image
        run: docker build -t hermes-audiobooks-api:${{ github.sha }} .
